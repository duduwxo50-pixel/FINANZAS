<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<title>Finanzas en pareja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2433;--mut:#6b7385;--bd:#e3e6ec;--pri:#2f6fed;--ok:#17a566;--warn:#e08a00;--bad:#d93f4c}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button,.btn{border:1px solid var(--bd);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--tx)}
nav button.on,.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.sm{padding:3px 8px;font-size:13px}.btn.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card{overflow-x:auto}.grid .card{margin:0}.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase}td.r,th.r{text-align:right}
.bar{height:8px;background:#e9ecf2;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f7;color:var(--mut)}
.paid{background:#e4f6ec;color:var(--ok)}.late{background:#fde8ea;color:var(--bad)}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
dialog{border:0;border-radius:14px;padding:18px;width:min(420px,94vw)}dialog::backdrop{background:#0006}
.center{max-width:420px;margin:8vh auto}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg{padding:8px 10px;border-radius:8px;background:#fff4e0;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(+n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KINDS={deuda:'Deuda / cuota',servicio:'Servicio',ahorro:'Ahorro / cadena',fijo:'Gasto fijo',variable:'Variable (presupuesto)'};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date();
let sb=null,S={user:null,hh:null,me:null,members:[],inc:[],com:[],pay:[],exp:[],month:ymd(new Date(today.getFullYear(),today.getMonth(),1)),tab:'resumen',msg:''};

const DEF={url:'https://pmdkmizxgtncujijttbi.supabase.co',key:'sb_publishable_OPR5iz0QFo94GfiMLwvINQ_4ddlWE2Z'};
function cfg(){return{url:localStorage.getItem('pf_url')||DEF.url,key:localStorage.getItem('pf_key')||DEF.key}}
async function init(){
  const c=cfg();if(!c.url||!c.key)return viewConfig();
  sb=supabase.createClient(c.url,c.key);
  const{data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{const had=!!S.user;S.user=s?.user||null;if(!!S.user!==had)boot()});
  S.user=data.session?.user||null;boot();
}
async function boot(){
  if(!S.user)return viewAuth();
  const{data,error}=await sb.from('pf_members').select('*,pf_households(*)').eq('user_id',S.user.id).limit(1);
  if(error)return viewAuth('Error: '+error.message+' (¿ejecutaste schema.sql?)');
  if(!data.length)return viewOnboard();
  S.me=data[0];S.hh=data[0].pf_households;await load();render();
}
async function load(){
  const h=S.hh.id,q=t=>sb.from(t).select('*').eq('household_id',h);
  const [m,i,c,p,e]=await Promise.all([q('pf_members'),q('pf_incomes').order('owner'),q('pf_commitments').order('amount',{ascending:false}),q('pf_payments'),q('pf_expenses').order('spent_on',{ascending:false})]);
  S.members=m.data||[];S.inc=i.data||[];S.com=c.data||[];S.pay=p.data||[];S.exp=e.data||[];
}
const set=(v)=>{$('#app').innerHTML=v};

/* ---------- vistas de acceso ---------- */
function viewConfig(){set(`<div class="center card"><h2>Conectar con Supabase</h2>
<p class="mut">Pega los datos de tu proyecto (Settings → API). Se guardan solo en este navegador.</p>
<label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co">
<label>Publishable / anon key</label><input id="k" placeholder="sb_publishable_... o eyJ...">
<p><button class="btn pri" onclick="saveCfg()">Guardar y continuar</button></p></div>`)}
function saveCfg(){const u=$('#u').value.trim().replace(/\/$/,''),k=$('#k').value.trim();if(!u||!k)return;localStorage.setItem('pf_url',u);localStorage.setItem('pf_key',k);init()}
function resetCfg(){localStorage.removeItem('pf_url');localStorage.removeItem('pf_key');location.reload()}
function viewAuth(m=''){set(`<div class="center card"><h2>💑 Finanzas en pareja</h2>
<label>PIN</label><input id="pw" type="password" inputmode="numeric" maxlength="8" autofocus placeholder="Tu PIN" onkeydown="if(event.key==='Enter')auth()">
<p><button class="btn pri" onclick="auth()">Entrar</button></p>
${m?`<div class="msg">${esc(m)}</div>`:''}
<p><a href="#" onclick="resetCfg();return false" class="mut">Cambiar conexión Supabase</a></p></div>`)}
async function auth(signup){
  const pin=$('#pw').value.trim();
  if(!/^\d{4,8}$/.test(pin))return viewAuth('Escribe tu PIN (4 a 8 dígitos).');
  let last=null;
  for(const u of ['duvier','jesica']){
    const r=await sb.auth.signInWithPassword({email:u+'@pf.example.com',password:'pf-'+pin+'-fin'});
    if(!r.error)return;last=r.error;
    if(!/invalid login/i.test(r.error.message))break;
  }
  viewAuth(/invalid login/i.test(last.message)?'PIN incorrecto.':last.message);
}
function viewOnboard(m=''){set(`<div class="center"><div class="card"><h3>Crear el hogar</h3><label>Nombre del hogar</label><input id="hn" value="Nuestro hogar">
<label>Tu nombre</label><input id="dn" placeholder="Ej: KD"><p><button class="btn pri" onclick="createHH()">Crear</button></p></div>
<div class="card"><h3>Unirme al hogar de mi pareja</h3><label>Código</label><input id="cd" placeholder="ABC123"><label>Tu nombre</label><input id="dn2">
<p><button class="btn" onclick="joinHH()">Unirme</button></p></div>${m?`<div class="msg">${esc(m)}</div>`:''}
<p><button class="btn sm" onclick="sb.auth.signOut()">Salir</button></p></div>`)}
async function createHH(){const{error}=await sb.rpc('pf_create_household',{p_name:$('#hn').value,p_display:$('#dn').value||'Yo'});if(error)return viewOnboard(error.message);boot()}
async function joinHH(){const{error}=await sb.rpc('pf_join_household',{p_code:$('#cd').value,p_display:$('#dn2').value||'Pareja'});if(error)return viewOnboard(error.message);boot()}

/* ---------- cálculos ---------- */
const mk=()=>S.month.slice(0,7);
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
function calc(){
  const inc=S.inc.filter(x=>x.active),com=S.com.filter(x=>x.active);
  const fixed=com.filter(c=>c.kind!=='variable'),vari=com.filter(c=>c.kind==='variable');
  const pays=S.pay.filter(p=>p.month===S.month),exps=S.exp.filter(e=>e.spent_on.startsWith(mk()));
  const T={ing:sum(inc),fix:sum(fixed),bud:sum(vari),ahorro:sum(fixed.filter(c=>c.kind==='ahorro')),paid:sum(pays),spent:sum(exps)};
  T.libre=T.ing-T.fix-T.bud;T.disp=T.ing-T.paid-T.spent;
  const byOwner={};inc.forEach(i=>byOwner[i.owner]=(byOwner[i.owner]||0)+ +i.amount);
  return{inc,com,fixed,vari,pays,exps,T,byOwner};
}
const paidOf=(c,pays)=>pays.find(p=>p.commitment_id===c.id);

/* ---------- render ---------- */
function render(){
  const tabs=[['resumen','Resumen'],['compromisos','Compromisos'],['variables','Gastos variables'],['ingresos','Ingresos'],['ajustes','Hogar']];
  const mo=new Date(S.month+'T00:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const C=calc();
  set(`<header><h1>💑 ${esc(S.hh.name)}</h1>
<div class="row" style="gap:4px"><button class="btn sm" onclick="mv(-1)">◀</button><b style="min-width:130px;text-align:center;text-transform:capitalize">${mo}</b><button class="btn sm" onclick="mv(1)">▶</button></div>
<button class="btn sm" onclick="sb.auth.signOut()">Salir</button></header>
<main><nav>${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</nav>
${V[S.tab](C)}</main>`);
}
function mv(d){const x=new Date(S.month+'T00:00');x.setMonth(x.getMonth()+d);S.month=ymd(x);render()}
const kpi=(l,v,cls='')=>`<div class="card kpi"><small>${l}</small><b class="${cls}">${fmt(v)}</b></div>`;
const V={
resumen(C){const T=C.T;
  const pend=C.fixed.filter(c=>!paidOf(c,C.pays)).sort((a,b)=>(a.due_day||99)-(b.due_day||99));
  const tot=T.ing||1;
  const share=Object.entries(C.byOwner).map(([o,v])=>{const p=v/tot,need=p*(T.fix+T.bud);
    return`<tr><td>${esc(o)}</td><td class="r">${fmt(v)}</td><td class="r">${(p*100).toFixed(1)}%</td><td class="r">${fmt(need)}</td></tr>`}).join('');
  const groups=Object.keys(KINDS).map(k=>[KINDS[k],sum(C.com.filter(c=>c.kind===k))]).filter(g=>g[1]>0);
  const emp=!S.inc.length&&!S.com.length;
  return(emp?`<div class="card"><b>Aún no hay datos.</b> ¿Cargo tus ingresos y compromisos iniciales (carro, casa Jamundí, Addi, recibos, cadena, comida)?<p><button class="btn pri" onclick="seed()">Cargar datos iniciales</button></p></div>`:'')+
  `<div class="grid">${kpi('Ingresos del hogar',T.ing)}${kpi('Compromisos fijos',T.fix)}${kpi('Presupuesto variable',T.bud)}${kpi('Saldo libre planeado',T.libre,T.libre<0?'neg':'pos')}</div>
  <div class="grid">${kpi('Pagado este mes',T.paid)}${kpi('Gastado en variables',T.spent)}${kpi('Disponible hoy',T.disp,T.disp<0?'neg':'pos')}${kpi('Ahorro / cadena',T.ahorro)}</div>
  <div class="card"><h3>Distribución de ingresos</h3>${groups.concat([['Saldo libre',Math.max(T.libre,0)]]).map(([n,v])=>`<div class="row"><span>${n}</span><span>${fmt(v)} · ${(v/tot*100).toFixed(0)}%</span></div><div class="bar" style="margin:4px 0 10px"><i style="width:${Math.min(100,v/tot*100)}%"></i></div>`).join('')}</div>
  <div class="card"><h3>Aporte proporcional por persona</h3><table><tr><th>Persona</th><th class="r">Ingreso</th><th class="r">%</th><th class="r">Debería cubrir</th></tr>${share||'<tr><td colspan=4 class="mut">Sin ingresos</td></tr>'}</table>
  <p class="mut" style="font-size:13px">“Debería cubrir” reparte compromisos + presupuesto variable según el peso de cada ingreso.</p></div>
  <div class="card"><h3>Pendientes del mes (${pend.length})</h3><table>${pend.map(c=>`<tr><td>${esc(c.concept)}</td><td class="mut">${c.due_day?'día '+c.due_day:''}</td><td class="r">${fmt(c.amount)}</td><td class="r"><button class="btn sm" onclick="togglePay('${c.id}')">Marcar pagado</button></td></tr>`).join('')||'<tr><td class="pos">Todo pagado ✓</td></tr>'}</table></div>`},
compromisos(C){return`<div class="card"><div class="row"><h3 style="margin:0">Compromisos mensuales</h3><button class="btn pri sm" onclick="editCom()">+ Nuevo</button></div>
  <table><tr><th>Concepto</th><th>Tipo</th><th class="r">Monto</th><th>Estado</th><th></th></tr>${C.fixed.map(c=>{const p=paidOf(c,C.pays),late=!p&&c.due_day&&S.month.slice(0,7)===ymd(today).slice(0,7)&&c.due_day<today.getDate();
  return`<tr><td>${esc(c.concept)}${c.due_day?`<br><small class="mut">día ${c.due_day}${c.installments_left?` · ${c.installments_left} cuotas`:''}</small>`:''}</td><td><span class="tag">${KINDS[c.kind]}</span></td><td class="r">${fmt(c.amount)}</td>
  <td><span class="tag ${p?'paid':late?'late':''}" style="cursor:pointer" onclick="togglePay('${c.id}')">${p?'✓ Pagado':late?'Vencido':'Pendiente'}</span></td>
  <td class="r"><button class="btn sm" onclick="editCom('${c.id}')">✎</button></td></tr>`}).join('')}
  <tr><th>Total</th><th></th><th class="r">${fmt(C.T.fix)}</th><th></th><th></th></tr></table></div>`},
variables(C){return`<div class="card"><div class="row"><h3 style="margin:0">Presupuestos variables</h3><button class="btn pri sm" onclick="editCom(null,'variable')">+ Categoría</button></div>
  ${C.vari.map(c=>{const sp=sum(C.exps.filter(e=>e.commitment_id===c.id)),pc=c.amount?sp/c.amount*100:0;
  return`<div style="margin:12px 0"><div class="row"><b>${esc(c.concept)}</b><span>${fmt(sp)} de ${fmt(c.amount)} <button class="btn sm" onclick="editCom('${c.id}')">✎</button></span></div><div class="bar"><i style="width:${Math.min(100,pc)}%;background:${pc>100?'var(--bad)':pc>80?'var(--warn)':'var(--ok)'}"></i></div></div>`}).join('')||'<p class="mut">Crea una categoría (ej: Comida).</p>'}</div>
  <div class="card"><div class="row"><h3 style="margin:0">Gastos del mes</h3><button class="btn pri sm" onclick="editExp()">+ Gasto</button></div>
  <table>${C.exps.map(e=>{const c=S.com.find(x=>x.id===e.commitment_id);return`<tr><td>${e.spent_on.slice(5)}</td><td>${esc(e.concept)}<br><small class="mut">${esc(c?.concept||'Sin categoría')} · ${esc(e.paid_by||'')}</small></td><td class="r">${fmt(e.amount)}</td><td class="r"><button class="btn sm" onclick="editExp('${e.id}')">✎</button></td></tr>`}).join('')||'<tr><td class="mut">Sin gastos este mes</td></tr>'}</table></div>`},
ingresos(C){return`<div class="card"><div class="row"><h3 style="margin:0">Ingresos mensuales</h3><button class="btn pri sm" onclick="editInc()">+ Nuevo</button></div>
  <table><tr><th>Persona</th><th>Concepto</th><th class="r">Monto</th><th></th></tr>${S.inc.map(i=>`<tr style="${i.active?'':'opacity:.5'}"><td>${esc(i.owner)}</td><td>${esc(i.concept)}</td><td class="r">${fmt(i.amount)}</td><td class="r"><button class="btn sm" onclick="editInc('${i.id}')">✎</button></td></tr>`).join('')}
  <tr><th colspan=2>Total activo</th><th class="r">${fmt(C.T.ing)}</th><th></th></tr></table></div>`},
ajustes(){return`<div class="card"><h3>Código para tu pareja</h3><p style="font-size:28px;letter-spacing:4px;margin:6px 0"><b>${esc(S.hh.code)}</b></p>
  <p class="mut">Que cree su cuenta en esta misma app y elija “Unirme al hogar” con este código.</p>
  <p>Miembros: ${S.members.map(m=>esc(m.display_name)).join(', ')}</p></div>
  <div class="card"><button class="btn bad" onclick="resetCfg()">Cambiar conexión Supabase</button></div>`}
};

/* ---------- formularios ---------- */
function form(title,fields,onSave,onDel){
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog"><h3 style="margin-top:0">${title}</h3>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select name="${f.k}">${f.o.map(([v,t])=>`<option value="${esc(v)}" ${String(f.v)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.list?`list="${f.list}"`:''}>`}`).join('')}
  <datalist id="own">${[...new Set(S.members.map(m=>m.display_name).concat(S.inc.map(i=>i.owner)))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="row" style="margin-top:16px"><span>${onDel?'<button type="button" class="btn bad" id="del">Eliminar</button>':''}</span><span><button type="button" class="btn" id="cx">Cancelar</button> <button class="btn pri" id="ok" type="button">Guardar</button></span></div></form>`;
  d.showModal();$('#cx').onclick=()=>d.close();
  $('#ok').onclick=async()=>{const o={};d.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value);await onSave(o);d.close();await load();render()};
  if(onDel)$('#del').onclick=async()=>{if(confirm('¿Eliminar?')){await onDel();d.close();await load();render()}};
}
const H=()=>S.hh.id,num=v=>+String(v).replace(/[^\d.-]/g,'')||0;
const run=async p=>{const{error}=await p;if(error)alert(error.message)};
function editInc(id){const r=S.inc.find(x=>x.id===id)||{owner:S.me.display_name,concept:'',amount:'',active:true};
  form(id?'Editar ingreso':'Nuevo ingreso',[{k:'owner',l:'Persona',v:r.owner,list:'own'},{k:'concept',l:'Concepto',v:r.concept},{k:'amount',l:'Monto mensual',t:'number',v:r.amount},{k:'active',l:'Estado',v:r.active,o:[['true','Activo'],['false','Inactivo']]}],
  o=>run(sb.from('pf_incomes').upsert({...(id&&{id}),household_id:H(),owner:o.owner,concept:o.concept,amount:num(o.amount),active:o.active==='true'})),id&&(()=>run(sb.from('pf_incomes').delete().eq('id',id))))}
function editCom(id,kind){const r=S.com.find(x=>x.id===id)||{concept:'',kind:kind||'deuda',amount:'',due_day:'',installments_left:'',active:true};
  form(id?'Editar compromiso':'Nuevo compromiso',[{k:'concept',l:'Concepto',v:r.concept},{k:'kind',l:'Tipo',v:r.kind,o:Object.entries(KINDS)},{k:'amount',l:'Monto mensual / presupuesto',t:'number',v:r.amount},{k:'due_day',l:'Día de pago (opcional)',t:'number',v:r.due_day},{k:'installments_left',l:'Cuotas restantes (opcional)',t:'number',v:r.installments_left},{k:'active',l:'Estado',v:r.active,o:[['true','Activo'],['false','Inactivo']]}],
  o=>run(sb.from('pf_commitments').upsert({...(id&&{id}),household_id:H(),concept:o.concept,kind:o.kind,amount:num(o.amount),due_day:o.due_day?+o.due_day:null,installments_left:o.installments_left?+o.installments_left:null,active:o.active==='true'})),id&&(()=>run(sb.from('pf_commitments').delete().eq('id',id))))}
function editExp(id){const r=S.exp.find(x=>x.id===id)||{spent_on:ymd(today),concept:'',amount:'',commitment_id:S.com.find(c=>c.kind==='variable')?.id||'',paid_by:S.me.display_name};
  form(id?'Editar gasto':'Nuevo gasto',[{k:'spent_on',l:'Fecha',t:'date',v:r.spent_on},{k:'concept',l:'Descripción',v:r.concept},{k:'amount',l:'Monto',t:'number',v:r.amount},{k:'commitment_id',l:'Categoría',v:r.commitment_id,o:[['','Sin categoría']].concat(S.com.filter(c=>c.kind==='variable').map(c=>[c.id,c.concept]))},{k:'paid_by',l:'Pagó',v:r.paid_by,list:'own'}],
  o=>run(sb.from('pf_expenses').upsert({...(id&&{id}),household_id:H(),spent_on:o.spent_on,concept:o.concept,amount:num(o.amount),commitment_id:o.commitment_id||null,paid_by:o.paid_by})),id&&(()=>run(sb.from('pf_expenses').delete().eq('id',id))))}
async function togglePay(cid){const c=S.com.find(x=>x.id===cid),p=S.pay.find(x=>x.commitment_id===cid&&x.month===S.month);
  if(p)await run(sb.from('pf_payments').delete().eq('id',p.id));
  else{await run(sb.from('pf_payments').insert({household_id:H(),commitment_id:cid,month:S.month,amount:c.amount,paid_by:S.me.display_name}));
    if(c.installments_left>0)await run(sb.from('pf_commitments').update({installments_left:c.installments_left-1}).eq('id',cid))}
  await load();render()}
async function seed(){
  const me=S.me.display_name;
  await run(sb.from('pf_incomes').insert([[me,'Ingreso principal',3462000],[me,'Ingreso 2',1440000],[me,'Ingreso 3',600000],['Esposa','Ingreso',2400000]].map(([owner,concept,amount])=>({household_id:H(),owner,concept,amount}))));
