<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2433;--mut:#6b7385;--bd:#e3e6ec;--pri:#2f6fed;--ok:#17a566;--warn:#e08a00;--bad:#d93f4c}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button,.btn{border:1px solid var(--bd);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--tx)}
nav button.on,.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.sm{padding:3px 8px;font-size:13px}.btn.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card{overflow-x:auto}.grid .card{margin:0}.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase}td.r,th.r{text-align:right}
.bar{height:8px;background:#e9ecf2;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f7;color:var(--mut)}
.paid{background:#e4f6ec;color:var(--ok)}.late{background:#fde8ea;color:var(--bad)}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
dialog{border:0;border-radius:14px;padding:18px;width:min(420px,94vw)}dialog::backdrop{background:#0006}
.center{max-width:420px;margin:8vh auto}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg{padding:8px 10px;border-radius:8px;background:#fff4e0;margin-top:10px;font-size:14px}
main{padding-bottom:96px}[hidden]{display:none!important}
#bnav{position:fixed;left:0;right:0;bottom:0;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 45%);z-index:6;pointer-events:none}
#bn-menu{pointer-events:auto;position:relative;background:#0f2443;color:#fff;border:0;border-radius:99px;padding:13px 36px;font:700 15px system-ui;letter-spacing:.5px;box-shadow:0 4px 14px #0005;cursor:pointer}
.bdg{position:absolute;top:-4px;right:-2px;background:var(--bad);color:#fff;border-radius:99px;font:700 11px system-ui;padding:2px 7px}
#menu{position:fixed;inset:0;background:#0b1220;z-index:20;overflow:auto;padding:56px 18px 30px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:760px;margin:0 auto}
@media(min-width:800px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mcard{position:relative;background:none;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 4px;font:inherit}
.mcard .mc{width:72px;height:72px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-size:30px}
.mcard b{text-transform:uppercase;font-size:13px;letter-spacing:.6px}.mcard.on .mc{outline:3px solid #fff}
.mcard .bdg{top:6px;right:calc(50% - 46px)}
.mclose{position:fixed;top:12px;right:14px;background:#ffffff22;color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.hero{text-align:center}.hero>small{color:var(--mut)}.hero>b{display:block;font-size:34px;margin:2px 0 12px}.hero .row{font-size:13px;color:var(--mut)}.hero .bar{margin:3px 0 10px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.leg{flex:1;min-width:200px}.leg .row{margin:5px 0;font-size:14px}
.donut{width:140px;height:140px;border-radius:50%;position:relative;flex:none}.donut:after{content:"";position:absolute;inset:28px;background:#fff;border-radius:50%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sy{font-size:12px;color:var(--mut)}.sy.off{color:var(--bad)}
.pd{display:flex;justify-content:center;gap:12px;height:28px;margin:12px 0 4px;align-items:center}.pd i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}.pd i.f{background:var(--pri)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.kp button{padding:16px 0;font:600 22px system-ui;border-radius:14px;border:1px solid var(--bd);background:#fff;color:var(--tx);cursor:pointer;touch-action:manipulation}.kp button:active{background:#e9ecf2}.kp button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
#fab{pointer-events:auto;position:absolute;right:14px;bottom:calc(8px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px #0005;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#0f2443;color:#fff;padding:10px 18px;border-radius:99px;z-index:30;font-weight:600;box-shadow:0 4px 14px #0005}
.ins{border-left:5px solid var(--bd);padding:10px 12px;margin:10px 0;background:#fafbfc;border-radius:0 8px 8px 0}.ins b{display:block;margin-bottom:2px}.ins p{margin:0;color:var(--mut);font-size:14px}
.ins.ok{border-color:var(--ok)}.ins.warn{border-color:var(--warn)}.ins.bad{border-color:var(--bad)}.ins.tip{border-color:var(--pri)}
.tag.soon{background:#fff4e0;color:var(--warn)}
/* tema calmado tipo app financiera */
:root{--bg:#f2f5fb;--bd:#e6eaf3;--pri:#3b6df0;--ok:#12a37a;--warn:#d98a1c;--bad:#c9772b}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.card{border:0;border-radius:18px;box-shadow:0 2px 14px #1a2b5512}
header{background:#f2f5fbcc;backdrop-filter:blur(8px);border:0}
.btn{border-radius:12px}.btn.bad{color:#b4443a}
.neg{color:#b9722a}.late{background:#fff3e0;color:#b9722a}.tag.soon{background:#eaf1ff;color:#3b6df0}
.bdg{background:var(--pri)}.sy.off{color:var(--warn)}.ins.bad{border-color:var(--warn)}
.hero{background:linear-gradient(135deg,#3b6df0,#12a37a);color:#fff;text-align:left;padding:20px}
.hero>small{color:#ffffffd9;font-size:14px}.hero>b{color:#fff!important;font-size:40px;letter-spacing:-.5px}
.hero .row{color:#ffffffe0}.hero .bar{background:#ffffff3a}.hero .bar i{background:#fff!important}
.kpi{position:relative}.kpi .ic{font-size:20px;display:block;margin-bottom:4px}
.bar{height:10px;border-radius:6px}
.hs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}
.hs>div{background:#ffffff24;border-radius:14px;padding:10px 12px;min-width:0}
.hs small{display:block;color:#ffffffe0;font-size:13px}.hs b{display:block;font-size:clamp(20px,6.2vw,32px);color:#fff;letter-spacing:-.5px;white-space:nowrap}
.ht{text-align:center;font-size:14px;color:#ffffffe6;margin:4px 0 14px}.ht b{color:#fff;font-size:17px}
.goal{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="bnav" style="display:none"><button id="fab" onclick="quickExp()" aria-label="Registrar gasto" title="Registrar gasto">＋</button><button id="bn-menu" onclick="menuAbrir()">☰ MENÚ<span class="bdg" id="bn-b" hidden></span></button></div>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(+n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KINDS={deuda:'Deuda / cuota',servicio:'Servicio',ahorro:'Ahorro / cadena',fijo:'Gasto fijo',variable:'Variable (presupuesto)'};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date();
let sb=null,S={user:null,hh:null,me:null,members:[],inc:[],rec:[],goals:[],gent:[],clos:[],com:[],pay:[],exp:[],month:ymd(new Date(today.getFullYear(),today.getMonth(),1)),tab:'resumen',msg:''};

const DEF={url:'https://pmdkmizxgtncujijttbi.supabase.co',key:'sb_publishable_OPR5iz0QFo94GfiMLwvINQ_4ddlWE2Z'};
function cfg(){return{url:localStorage.getItem('pf_url')||DEF.url,key:localStorage.getItem('pf_key')||DEF.key}}
async function init(){
  const c=cfg();if(!c.url||!c.key)return viewConfig();
  sb=supabase.createClient(c.url,c.key);
  const{data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{const had=!!S.user;S.user=s?.user||null;if(!!S.user!==had)boot()});
  S.user=data.session?.user||null;boot();
}
async function boot(){
  if(!S.user){S.hh=null;return viewAuth()}
  const{data,error}=await sb.from('pf_members').select('*,pf_households(*)').eq('user_id',S.user.id).limit(1);
  if(error)return viewAuth('Error: '+error.message+' (¿ejecutaste schema.sql?)');
  if(!data.length)return viewOnboard();
  S.me=data[0];S.hh=data[0].pf_households;await load();S.last=new Date();render();
}
async function load(){
  const h=S.hh.id,q=t=>sb.from(t).select('*').eq('household_id',h);
  const [m,i,c,p,e,rc,gl,ge,cl]=await Promise.all([q('pf_members'),q('pf_incomes').order('owner'),q('pf_commitments').order('amount',{ascending:false}),q('pf_payments'),q('pf_expenses').order('spent_on',{ascending:false}),q('pf_income_receipts'),q('pf_goals').order('created_at'),q('pf_goal_entries'),q('pf_closings')]);
  const bad=[m,i,c,p,e,rc,gl,ge,cl].find(x=>x.error);if(bad)throw bad.error;
  S.members=m.data||[];S.inc=i.data||[];S.com=c.data||[];S.pay=p.data||[];S.exp=e.data||[];S.rec=rc.data||[];S.goals=gl.data||[];S.gent=ge.data||[];S.clos=cl.data||[];
}
const set=(v)=>{$('#app').innerHTML=v;$('#bnav').style.display='none'};

/* ---------- vistas de acceso ---------- */
function viewConfig(){set(`<div class="center card"><h2>Conectar con Supabase</h2>
<p class="mut">Pega los datos de tu proyecto (Settings → API). Se guardan solo en este navegador.</p>
<label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co">
<label>Publishable / anon key</label><input id="k" placeholder="sb_publishable_... o eyJ...">
<p><button class="btn pri" onclick="saveCfg()">Guardar y continuar</button></p></div>`)}
function saveCfg(){const u=$('#u').value.trim().replace(/\/$/,''),k=$('#k').value.trim();if(!u||!k)return;localStorage.setItem('pf_url',u);localStorage.setItem('pf_key',k);init()}
function resetCfg(){localStorage.removeItem('pf_url');localStorage.removeItem('pf_key');location.reload()}
let PIN='';
const pdHtml=()=>Array.from({length:Math.max(4,PIN.length)},(_,i)=>`<i class="${i<PIN.length?'f':''}"></i>`).join('');
function kp(d){if(d==='<')PIN=PIN.slice(0,-1);else if(PIN.length<8)PIN+=d;const e=$('#pd');if(e)e.innerHTML=pdHtml()}
document.addEventListener('keydown',e=>{if(!$('#pd'))return;if(/^\d$/.test(e.key))kp(e.key);else if(e.key==='Backspace')kp('<');else if(e.key==='Enter')auth()});
function viewAuth(m=''){PIN='';set(`<div class="center card" style="text-align:center"><h2>💑 Finanzas en pareja</h2>
<p class="mut" style="margin:0">Escribe tu PIN</p><div class="pd" id="pd">${pdHtml()}</div>
<div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="kp('${n}')">${n}</button>`).join('')}<button onclick="kp('<')">⌫</button><button onclick="kp('0')">0</button><button class="pri" onclick="auth()">✓</button></div>
${m?`<div class="msg">${esc(m)}</div>`:''}
<p><a href="#" onclick="resetCfg();return false" class="mut">Cambiar conexión Supabase</a></p></div>`)}
async function auth(signup){
  const pin=PIN;
  if(!/^\d{4,8}$/.test(pin))return viewAuth('Escribe tu PIN (4 a 8 dígitos).');
  let last=null;
  for(const u of ['duvier','jesica']){
    const r=await sb.auth.signInWithPassword({email:u+'@pf.example.com',password:'pf-'+pin+'-fin'});
    if(!r.error)return;last=r.error;
    if(!/invalid login/i.test(r.error.message))break;
  }
  viewAuth(/invalid login/i.test(last.message)?'PIN incorrecto.':last.message);
}
function viewOnboard(m=''){set(`<div class="center"><div class="card"><h3>Crear el hogar</h3><label>Nombre del hogar</label><input id="hn" value="Nuestro hogar">
<label>Tu nombre</label><input id="dn" placeholder="Ej: KD"><p><button class="btn pri" onclick="createHH()">Crear</button></p></div>
<div class="card"><h3>Unirme al hogar de mi pareja</h3><label>Código</label><input id="cd" placeholder="ABC123"><label>Tu nombre</label><input id="dn2">
<p><button class="btn" onclick="joinHH()">Unirme</button></p></div>${m?`<div class="msg">${esc(m)}</div>`:''}
<p><button class="btn sm" onclick="sb.auth.signOut()">Salir</button></p></div>`)}
async function createHH(){const{error}=await sb.rpc('pf_create_household',{p_name:$('#hn').value,p_display:$('#dn').value||'Yo'});if(error)return viewOnboard(error.message);boot()}
async function joinHH(){const{error}=await sb.rpc('pf_join_household',{p_code:$('#cd').value,p_display:$('#dn2').value||'Pareja'});if(error)return viewOnboard(error.message);boot()}

/* ---------- cálculos ---------- */
const mk=()=>S.month.slice(0,7);
const sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
function calc(){
  const inc=S.inc.filter(x=>x.active),com=S.com.filter(x=>x.active);
  const fixed=com.filter(c=>c.kind!=='variable'),vari=com.filter(c=>c.kind==='variable');
  const pays=S.pay.filter(p=>p.month===S.month),exps=S.exp.filter(e=>e.spent_on.startsWith(mk()));
  const recs=S.rec.filter(r=>r.month===S.month);
  const T={ing:sum(inc.map(i=>({amount:i.amount*(i.pay_days||[1]).length}))),rec:sum(recs),recS:sum(recs.filter(r=>r.income_id)),fix:sum(fixed),bud:sum(vari),ahorro:sum(fixed.filter(c=>c.kind==='ahorro')),paid:sum(pays),spent:sum(exps)};
  T.libre=T.ing-T.fix-T.bud;T.disp=T.rec-T.paid-T.spent;
  const byOwner={};inc.forEach(i=>byOwner[i.owner]=(byOwner[i.owner]||0)+i.amount*(i.pay_days||[1]).length);
  return{inc,com,fixed,vari,pays,exps,recs,T,byOwner};
}
const paidOf=(c,pays)=>pays.find(p=>p.commitment_id===c.id);

/* ---------- render ---------- */
const MENU=[['resumen','🏠','Inicio'],['compromisos','📋','Compromisos'],['ingresos','💰','Ingresos'],['consejos','💡','Consejos'],['variables','🛒','Gastos'],['metas','🎯','Metas'],['cierre','🗓️','Cierre'],['ajustes','⚙️','Hogar']];
const hhmm=d=>d?d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}):'';
function render(){
  const mo=new Date(S.month+'T00:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const C=calc();
  S.bd={compromisos:C.fixed.filter(c=>!paidOf(c,C.pays)&&['late','today','soon'].includes(dueInfo(c).k)).length,ingresos:cobros(C).filter(x=>!x.r).length,cierre:cierrePend()?1:0};
  set(`<header><h1>💑 ${esc(S.hh.name)}</h1>
<div class="row" style="gap:4px"><button class="btn sm" onclick="mv(-1)">◀</button><b style="min-width:130px;text-align:center;text-transform:capitalize">${mo}</b><button class="btn sm" onclick="mv(1)">▶</button></div>
<span><button class="btn sm" onclick="sync(true)" title="Sincronizar">${S.syncing?'⏳':'↻'}</button> <span class="sy ${S.off?'off':''}">${S.off?'sin conexión':'sincronizado '+hhmm(S.last)}</span></span></header>
<main>${V[S.tab](C)}</main>`);
  $('#bnav').style.display='flex';
  const n=S.bd.compromisos+S.bd.ingresos+S.bd.cierre,b=$('#bn-b');b.hidden=!n;b.textContent=n;
}
async function sync(manual){
  if(!S.hh||S.syncing)return;S.syncing=true;if(manual)render();
  try{await load();S.last=new Date();S.off=false}catch(e){S.off=true}
  S.syncing=false;if(S.hh&&!$('#dlg').open)render();
}
function menuAbrir(){const bd=S.bd||{};
  $('#menu').innerHTML=`<button class="mclose" onclick="menuCerrar()">✕</button><div class="mgrid"><button class="mcard" onclick="menuCerrar();quickExp()"><span class="mc" style="background:var(--ok)">＋</span><b>Registrar gasto</b></button>${MENU.map(([k,i,t])=>`<button class="mcard ${S.tab===k?'on':''}" onclick="irTab('${k}')"><span class="mc">${i}</span><b>${t}</b>${bd[k]?`<span class="bdg">${bd[k]}</span>`:''}</button>`).join('')}
  <button class="mcard" onclick="menuCerrar();sync(true)"><span class="mc">🔄</span><b>Sincronizar</b></button>
  <button class="mcard" onclick="menuCerrar();sb.auth.signOut()"><span class="mc">🚪</span><b>Salir</b></button></div>`;
  $('#menu').hidden=false}
const menuCerrar=()=>{$('#menu').hidden=true};
function irTab(k){S.tab=k;menuCerrar();render();scrollTo(0,0)}
setInterval(()=>{if(S.hh&&!document.hidden&&!$('#dlg').open&&$('#menu').hidden)sync()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
addEventListener('online',()=>sync());addEventListener('offline',()=>{S.off=true;if(S.hh)render()});
history.replaceState(null,'',location.href);
const COL=['#2f6fed','#17a566','#e08a00','#8b5cf6','#d93f4c','#0ea5b7'];
const prog=(l,v,m)=>`<div class="row"><span>${l}</span><span>${fmt(v)} de ${fmt(m)}</span></div><div class="bar"><i style="width:${m?Math.min(100,v/m*100):0}%"></i></div>`;
function donut(parts,tot){let acc=0;const g=parts.map(([n,v],i)=>{const a=Math.min(100,acc/tot*100);acc+=v;return`${COL[i%6]} ${a}% ${Math.min(100,acc/tot*100)}%`}).join(',');
  return`<div class="dn"><div class="donut" style="background:conic-gradient(${g?g+',':''}#e9ecf2 0 100%)"></div><div class="leg">${parts.map(([n,v],i)=>`<div class="row"><span><i class="dot" style="background:${COL[i%6]}"></i>${esc(n)}</span><span>${fmt(v)} · ${(v/tot*100).toFixed(0)}%</span></div>`).join('')}</div></div>`}
function mv(d){const x=new Date(S.month+'T00:00');x.setMonth(x.getMonth()+d);S.month=ymd(x);render()}
const kpi=(l,v,cls='',ic='')=>`<div class="card kpi">${ic?`<span class="ic">${ic}</span>`:''}<small>${l}</small><b class="${cls}">${fmt(v)}</b></div>`;
const V={
resumen(C){const T=C.T;
  const pend=C.fixed.filter(c=>!paidOf(c,C.pays)).sort((a,b)=>(a.due_day||99)-(b.due_day||99)),isSoon=c=>['late','today','soon'].includes(dueInfo(c).k),por=pend.filter(isSoon).sort((a,b)=>dueInfo(a).d-dueInfo(b).d),later=pend.filter(c=>!isSoon(c));
  const tot=T.ing||1;
  const share=Object.entries(C.byOwner).map(([o,v])=>{const p=v/tot,need=p*(T.fix+T.bud);
    const put=sum(C.pays.filter(x=>x.paid_by===o))+sum(C.exps.filter(x=>x.paid_by===o)),rest=v-need;
    return`<tr><td>${esc(o)}<br><small class="mut">${(p*100).toFixed(0)}% del hogar · ya puso ${fmt(put)}</small></td><td class="r">${fmt(v)}</td><td class="r"><b>${fmt(need)}</b><br><small class="mut">${v?(need/v*100).toFixed(0):0}% de su sueldo</small></td><td class="r ${rest<0?'neg':'pos'}"><b>${fmt(rest)}</b><br><small class="mut">${v?(rest/v*100).toFixed(0):0}% de su sueldo</small></td></tr>`}).join('');
  const groups=Object.keys(KINDS).map(k=>[KINDS[k],sum(C.com.filter(c=>c.kind===k))]).filter(g=>g[1]>0);
  const emp=!S.inc.length&&!S.com.length;

/* ---------- formularios ---------- */
function form(title,fields,onSave,onDel){
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog"><h3 style="margin-top:0">${title}</h3>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select name="${f.k}">${f.o.map(([v,t])=>`<option value="${esc(v)}" ${String(f.v)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select>`:f.t==='money'?`<input name="${f.k}" class="money" inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${money(f.v)}">`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.list?`list="${f.list}"`:''}>`}`).join('')}
  <datalist id="own">${[...new Set(S.members.map(m=>m.display_name).concat(S.inc.map(i=>i.owner)))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="row" style="margin-top:16px"><span>${onDel?'<button type="button" class="btn bad" id="del">Eliminar</button>':''}</span><span><button type="button" class="btn" id="cx">Cancelar</button> <button class="btn pri" id="ok" type="button">Guardar</button></span></div></form>`;
  d.showModal();$('#cx').onclick=()=>d.close();
  $('#ok').onclick=async()=>{const o={};d.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value);await onSave(o);d.close();await load();render()};
  if(onDel)$('#del').onclick=async()=>{if(confirm('¿Eliminar?')){await onDel();d.close();await load();render()}};
}
const H=()=>S.hh.id,num=v=>+String(v).replace(/\D/g,'')||0;
const money=v=>{const d=String(Math.round(+v||0)).replace(/\D/g,'');return d&&d!=='0'?'$ '+d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''};
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('money')){const d=t.value.replace(/\D/g,'').replace(/^0+/,'');t.value=d?'$ '+d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''}});
const run=async p=>{const{error}=await p;if(error)alert(error.message)};
const parseDays=v=>{const d=[...new Set(String(v).split(/[,\s]+/).map(Number).filter(n=>n>=1&&n<=31))].sort((a,b)=>a-b);return d.length?d:[30]};
function editInc(id){const r=S.inc.find(x=>x.id===id)||{owner:S.me.display_name,concept:'',amount:'',pay_days:[30],active:true};
  form(id?'Editar ingreso':'Nuevo ingreso',[{k:'owner',l:'Persona',v:r.owner,list:'own'},{k:'concept',l:'Concepto',v:r.concept},{k:'amount',l:'Monto por pago',t:'money',v:r.amount},{k:'pay_days',l:'Días de pago del mes (ej: 15,30)',v:(r.pay_days||[30]).join(',')},{k:'active',l:'Estado',v:r.active,o:[['true','Activo'],['false','Inactivo']]}],
  o=>run(sb.from('pf_incomes').upsert({...(id&&{id}),household_id:H(),owner:o.owner,concept:o.concept,amount:num(o.amount),pay_days:parseDays(o.pay_days),active:o.active==='true'})),id&&(()=>run(sb.from('pf_incomes').delete().eq('id',id))))}
function editCom(id,kind){const r=S.com.find(x=>x.id===id)||{concept:'',kind:kind||'deuda',amount:'',due_day:'',installments_left:'',active:true};
  form(id?'Editar compromiso':'Nuevo compromiso',[{k:'concept',l:'Concepto',v:r.concept},{k:'kind',l:'Tipo',v:r.kind,o:Object.entries(KINDS)},{k:'amount',l:'Monto mensual / presupuesto',t:'money',v:r.amount},{k:'due_day',l:'Día de pago (opcional)',t:'number',v:r.due_day},{k:'installments_left',l:'Cuotas restantes (opcional)',t:'number',v:r.installments_left},{k:'active',l:'Estado',v:r.active,o:[['true','Activo'],['false','Inactivo']]}],
  o=>run(sb.from('pf_commitments').upsert({...(id&&{id}),household_id:H(),concept:o.concept,kind:o.kind,amount:num(o.amount),due_day:o.due_day?+o.due_day:null,installments_left:o.installments_left?+o.installments_left:null,active:o.active==='true'})),id&&(()=>run(sb.from('pf_commitments').delete().eq('id',id))))}
function editExp(id){const r=S.exp.find(x=>x.id===id)||{spent_on:ymd(today),concept:'',amount:'',commitment_id:S.com.find(c=>c.kind==='variable')?.id||'',paid_by:S.me.display_name};
  form(id?'Editar gasto':'Nuevo gasto',[{k:'spent_on',l:'Fecha',t:'date',v:r.spent_on},{k:'concept',l:'Descripción',v:r.concept},{k:'amount',l:'Monto',t:'money',v:r.amount},{k:'commitment_id',l:'Categoría',v:r.commitment_id,o:[['','Sin categoría']].concat(S.com.filter(c=>c.kind==='variable').map(c=>[c.id,c.concept]))},{k:'paid_by',l:'Pagó',v:r.paid_by,list:'own'}],
  o=>run(sb.from('pf_expenses').upsert({...(id&&{id}),household_id:H(),spent_on:o.spent_on,concept:o.concept,amount:num(o.amount),commitment_id:o.commitment_id||null,paid_by:o.paid_by})),id&&(()=>run(sb.from('pf_expenses').delete().eq('id',id))))}
async function togglePay(cid){const c=S.com.find(x=>x.id===cid),p=S.pay.find(x=>x.commitment_id===cid&&x.month===S.month);
  if(p)await run(sb.from('pf_payments').delete().eq('id',p.id));
  else{await run(sb.from('pf_payments').insert({household_id:H(),commitment_id:cid,month:S.month,amount:c.amount,paid_by:S.me.display_name}));
    if(c.installments_left>0)await run(sb.from('pf_commitments').update({installments_left:c.installments_left-1}).eq('id',cid))}
  await load();render()}
function cobros(C){const cur=S.month.slice(0,7)===ymd(today).slice(0,7),L=[];
  C.inc.forEach(i=>(i.pay_days||[1]).forEach(d=>{const r=S.rec.find(x=>x.income_id===i.id&&x.month===S.month&&x.pay_day===d);L.push({i,d,r,late:!r&&cur&&d<=today.getDate()})}));
  return L.sort((a,b)=>a.d-b.d)}

const CHIPS=['Restaurante','Mercado','Gasolina','Domicilio','Gasto hormiga','Salida'];

function advice(C){
  const T=C.T,ing=T.ing||1,out=[],P=v=>Math.round(v/ing*100)+'%',add=(lv,t,x)=>out.push({lv,t,x});
  const deb=C.fixed.filter(c=>c.kind==='deuda'),deudas=sum(deb),serv=sum(C.fixed.filter(c=>c.kind==='servicio'||c.kind==='fijo')),ah=T.ahorro,lib=T.libre;
  const dr=deudas/ing;
  add(dr>.4?'bad':dr>.3?'warn':'ok','Cuotas y créditos: '+P(deudas)+' de tus ingresos',dr>.3?`Tus cuotas suman ${fmt(deudas)}. Son compromisos que ya tienen su lugar en el plan. Para ir liberando espacio, lo mejor es no sumar cuotas nuevas y terminar primero las más pequeñas: cada una que se acaba libera su cuota. Referencia sana: menos del 30%.`:`Tus cuotas (${fmt(deudas)}) están en un nivel sano, por debajo del 30%.`);
  const ar=ah/ing;
  add(ar<.1?'warn':'ok','Ahorro: '+P(ah),ar<.1?`Hay espacio para ahorrar un poco más. Una idea: separar el 10% (${fmt(ing*.1)}) apenas llegue cada pago.`:`Muy bien: ahorras ${fmt(ah)} al mes (cadena/ahorro). Mantenlo aunque suban los gastos.`);
  const ess=T.fix-ah+T.bud,meta=ess*3;
  if(lib>0)add('tip','Fondo de emergencia',`Una meta sana es tener 3 meses de gastos esenciales: ${fmt(meta)}. Con tu saldo libre de ${fmt(lib)} al mes, lo juntarías en unos ${Math.ceil(meta/lib)} meses si lo destinaras todo.`);
  add(lib<0?'bad':lib/ing<.05?'bad':lib/ing<.1?'warn':'ok','Saldo libre: '+fmt(lib)+' ('+P(Math.max(lib,0))+')',lib<0?'Este mes los gastos planeados superan los ingresos esperados; con pequeños ajustes en variables y servicios se equilibra.':lib/ing<.1?'Tu margen es ajustado. Subirlo a más del 10% te daría más tranquilidad ante imprevistos.':'Tienes un colchón mensual saludable para imprevistos y metas.');
  const cur=S.month.slice(0,7)===ymd(today).slice(0,7),dim=new Date(+S.month.slice(0,4),+S.month.slice(5,7),0).getDate(),dd=today.getDate();
  C.vari.forEach(c=>{const sp=sum(C.exps.filter(e=>e.commitment_id===c.id)),pc=c.amount?sp/c.amount:0;
    if(cur&&sp>0){const pr=sp/dd*dim;if(pr>c.amount)add('warn',c.concept+': ritmo un poco alto',`Llevas ${fmt(sp)} de ${fmt(c.amount)}. A este ritmo cerrarías el mes en ~${fmt(pr)}. Con unos ${fmt(Math.max(c.amount-sp,0)/Math.max(dim-dd,1))} diarios llegas justo al presupuesto.`);else add('ok',c.concept+': buen ritmo',`Llevas ${fmt(sp)} de ${fmt(c.amount)} (${Math.round(pc*100)}%); al ritmo actual terminas en ~${fmt(pr)}.`)}});
  const sc=sum(C.exps.filter(e=>!e.commitment_id));if(sc>0)add('tip','Gastos sin categoría: '+fmt(sc),'Asígnales una categoría variable para saber en qué se va la plata y si el presupuesto alcanza.');
  const q1i=sum(C.inc.map(i=>({amount:i.amount*(i.pay_days||[]).filter(d=>d<=15).length}))),q2i=sum(C.inc.map(i=>({amount:i.amount*(i.pay_days||[]).filter(d=>d>15).length})));
  const q1c=sum(C.fixed.filter(c=>c.due_day&&c.due_day<=15)),q2c=sum(C.fixed.filter(c=>c.due_day&&c.due_day>15)),sd=sum(C.fixed.filter(c=>!c.due_day));
  if(sd>0)add('tip','Compromisos sin día de pago ('+fmt(sd)+')','Ponles su día de pago en Compromisos para ver cómo se reparten entre quincenas y evitar sorpresas de liquidez.');
  if(q1c+q2c>0){add(q2c>q2i?'bad':q1c>q1i?'bad':'ok','Flujo por quincena',`Días 1–15: entran ${fmt(q1i)} y salen ${fmt(q1c)} con fecha. Días 16–31: entran ${fmt(q2i)} y salen ${fmt(q2c)} con fecha. ${q2c>q2i||q1c>q1i?'Una quincena va más ajustada: puedes mover una fecha de pago o apartar un poco de la anterior.':'Las dos quincenas alcanzan.'}`)}
  const dl=deb.filter(c=>c.installments_left).sort((a,b)=>a.installments_left-b.installments_left);
  if(dl.length){const d=dl[0],f=new Date(today.getFullYear(),today.getMonth()+d.installments_left,1);add('tip','Próxima deuda en terminar: '+d.concept,`Te quedan ${d.installments_left} cuotas (≈ ${f.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}). Al terminarla liberas ${fmt(d.amount)} cada mes para ahorro.`)}
  else if(deb.length)add('tip','Agrega las cuotas restantes de tus deudas','En Compromisos edita cada deuda y escribe cuántas cuotas le faltan: así te digo cuál se acaba primero y cuánto liberas cuando termine.');
  const sm=deb.slice().sort((a,b)=>a.amount-b.amount)[0];if(sm&&lib>0)add('tip','Idea: cerrar primero la cuota más pequeña',`Si adelantas con ${fmt(lib*.3)} extra a «${sm.concept}», la cierras antes y liberas ${fmt(sm.amount)} al mes (método bola de nieve).`);
  return{out,deudas,serv,rec:C.fixed.filter(c=>c.kind==='servicio'||c.kind==='fijo').concat(C.vari).sort((a,b)=>b.amount-a.amount)}}
const SOON=5;
function dueInfo(c){
  if(!c.due_day)return{k:'nodate',d:null};
  const y=+S.month.slice(0,4),m=+S.month.slice(5,7)-1,dim=new Date(y,m+1,0).getDate(),dd=Math.min(c.due_day,dim);
  const t=new Date(today.getFullYear(),today.getMonth(),today.getDate()),diff=Math.round((new Date(y,m,dd)-t)/86400000);
  return{d:diff,k:diff<0?'late':diff===0?'today':diff<=SOON?'soon':'later'}}
function bal(C){
  const me=S.me.display_name,names=[...new Set([me].concat(S.members.map(m=>m.display_name),C.inc.map(i=>i.owner)))];
  const own=r=>r.income_id?((S.inc.find(i=>i.id===r.income_id)||{}).owner):r.owner;
  return names.map(n=>({n,v:sum(C.recs.filter(r=>own(r)===n))-sum(C.pays.filter(x=>x.paid_by===n))-sum(C.exps.filter(x=>x.paid_by===n))}))}
function reserva(C){
  const unpaid=C.fixed.filter(c=>!paidOf(c,C.pays)),P=[];
  C.inc.forEach(i=>(i.pay_days||[1]).forEach(d=>P.push({i,d,amt:+i.amount,res:0,vars:0,r:S.rec.find(x=>x.income_id===i.id&&x.month===S.month&&x.pay_day===d)})));
  P.sort((a,b)=>a.d-b.d);const tot=sum(P.map(p=>({amount:p.amt})))||1;
  unpaid.forEach(c=>{let el=c.due_day?P.filter(p=>p.d<=c.due_day):P;if(!el.length)el=P;const t=sum(el.map(p=>({amount:p.amt})))||1;el.forEach(p=>p.res+=c.amount*p.amt/t)});
  P.forEach(p=>p.vars=C.T.bud*p.amt/tot);return{P,unpaid:sum(unpaid)}}
function reservaCard(C){const R=reserva(C);
  return`<div class="card"><h3 style="margin-top:0">🏦 Cuánto guardar de cada ingreso</h3><p class="mut" style="margin-top:0;font-size:13px">Falta pagar ${fmt(R.unpaid)}. Se reparte entre los ingresos que llegan antes de cada fecha de pago; sepáralo apenas te paguen.</p>
  <table><tr><th>Ingreso</th><th class="r">Llega</th><th class="r">Guardar pagos</th><th class="r">Variables</th><th class="r">Libre</th></tr>${R.P.map(p=>{const lib=p.amt-p.res-p.vars;return`<tr><td>${esc(p.i.owner)} · ${esc(p.i.concept)}<br><small class="mut">día ${p.d}${p.r?' · ✓ recibido':''}</small></td><td class="r">${fmt(p.amt)}</td><td class="r"><b>${fmt(p.res)}</b><br><small class="mut">${Math.round(p.res/p.amt*100)}%</small></td><td class="r">${fmt(p.vars)}</td><td class="r ${lib<0?'neg':'pos'}">${fmt(lib)}</td></tr>`}).join('')||'<tr><td class="mut" colspan=5>Sin ingresos</td></tr>'}</table></div>`}
function goalState(g){const e=S.gent.find(x=>x.goal_id===g.id&&x.month===S.month);if(!e)return'none';return(!g.monthly_target||e.amount>=g.monthly_target)?'ok':'part'}
function goalSug(C){const T=C.T,ing=T.ing||1,r10=v=>Math.max(10000,Math.round(v/10000)*10000),lib=Math.max(T.libre,0),ess=T.fix-T.ahorro+T.bud,sm=C.fixed.filter(c=>c.kind==='deuda').sort((a,b)=>a.amount-b.amount)[0],A=[];
  A.push({emoji:'🌱',name:'Ahorro mensual del 10%',monthly:r10(ing*.1),total:null,why:`Separar ${fmt(r10(ing*.1))} al mes (el 10% de sus ingresos) apenas llegue cada pago.`});
  A.push({emoji:'🛟',name:'Fondo de emergencia',monthly:r10(lib*.5),total:Math.round(ess*3),why:`Tres meses de gastos esenciales son ${fmt(ess*3)}. Con ${fmt(r10(lib*.5))} al mes lo van armando con calma.`});
  if(sm)A.push({emoji:'💳',name:'Adelantar '+sm.concept,monthly:r10(lib*.3),total:null,why:`Un extra de ${fmt(r10(lib*.3))} al mes para cerrar antes «${esc(sm.concept)}» y liberar ${fmt(sm.amount)} mensuales.`});
  return A}
const upGoal=(id,amount)=>run(sb.from('pf_goal_entries').upsert({household_id:H(),goal_id:id,month:S.month,amount},{onConflict:'goal_id,month'}));

  o=>run(sb.from('pf_goals').upsert({...(id&&{id}),household_id:H(),emoji:o.emoji||'🎯',name:o.name,monthly_target:num(o.monthly_target),total_target:num(o.total_target)||null,active:o.active==='true'})),id&&(()=>run(sb.from('pf_goals').delete().eq('id',id))))}

async function cierreGuardar(){
  const rows=[...document.querySelectorAll('[data-cl]')].filter(e=>e.value.trim()).map(e=>({household_id:H(),month:S.month,owner:e.dataset.cl,balance:num(e.value)}));

async function cierreAjuste(n,diff){const y=+S.month.slice(0,4),m=+S.month.slice(5,7)-1,ld=ymd(new Date(y,m+1,0));

function cierreInfo(C,cl,B){
  const T=C.T,items=[],add=(lv,t,x)=>items.push({lv,t,x});
  const pag=C.fixed.filter(c=>paidOf(c,C.pays)).length,n=C.fixed.length,ip=T.ing?Math.round(T.recS/T.ing*100):0;
  add(ip>=100?'ok':'tip','Ingresos: cobraron el '+ip+'% de lo esperado',`Recibieron ${fmt(T.recS)} de ${fmt(T.ing)} esperados.`);
  add(pag===n?'ok':'tip','Compromisos: '+pag+' de '+n+' al día',pag===n?'Todo quedó al día. 👏':'Quedaron pendientes: '+esc(C.fixed.filter(c=>!paidOf(c,C.pays)).map(c=>c.concept).join(', '))+'.');
  const over=C.vari.map(c=>({c,sp:sum(C.exps.filter(e=>e.commitment_id===c.id))})).filter(o=>o.sp>o.c.amount);
  add(over.length?'warn':'ok',over.length?'Variables: '+over.length+' categoría(s) pasaron el presupuesto':'Variables: dentro del presupuesto',over.length?over.map(o=>esc(o.c.concept)+': '+fmt(o.sp)+' de '+fmt(o.c.amount)).join(' · '):'Comida y gasolina se mantuvieron en lo planeado.');
  const sc=sum(C.exps.filter(e=>!e.commitment_id));if(sc>0)add('tip','Gastos fuera de presupuesto: '+fmt(sc),'Son gastos sin categoría (imprevistos, ajustes). Si se repiten, vale la pena darles su propia categoría.');
  const G=S.goals.filter(g=>g.active),met=G.filter(g=>goalState(g)==='ok'),saved=sum(S.gent.filter(x=>x.month===S.month));
  add(!G.length?'tip':met.length===G.length?'ok':'tip',G.length?'Metas: '+met.length+' de '+G.length+' cumplidas':'Metas: aún no tienen',G.length?'Ahorraron '+fmt(saved)+' este mes.':'Creen una meta de ahorro en 🎯 Metas para el próximo mes.');
  const fin=sum(cl.map(c=>({amount:c.balance})));
  add(fin>0?'ok':'tip','Terminaron con '+fmt(fin)+' en cuentas','Ese saldo pasa como inicio del mes siguiente.');
  const pts=(pag===n?1:0)+(over.length?0:1)+(G.length&&met.length===G.length?1:0)+(fin>0?1:0);
  const label=pts>=4?'🌟 Mes excelente':pts===3?'👏 Muy buen mes':pts===2?'🌱 Buen mes, con espacio para mejorar':'💪 Mes retador: ya quedó registrado y el próximo lo mejoramos';
  const diffs=cl.map(c=>{const b=B.find(x=>x.n===c.owner),cv=b?b.v:0;return{n:c.owner,calc:cv,decl:+c.balance,diff:+c.balance-cv}}).filter(d=>Math.abs(d.diff)>1000);
  return{items,label,diffs}}
